<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>R7 — Winter Collection, Coming Soon</title>
<script>try{var t=localStorage.getItem("r7-theme");document.documentElement.dataset.theme=t||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Anton&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f5f2;--fg:#0a0a0a;--mut:#6b6b6b;--card:#ecebe7;--line:#d4d2cc;--red:#e10600;--glow:rgba(225,6,0,.25);--glass:rgba(246,245,242,.7);
--d:"Anton",Impact,sans-serif;--b:"Space Grotesk",system-ui,sans-serif;box-sizing:border-box}
:root[data-theme=dark]{--bg:#050507;--fg:#f4f4f4;--mut:#8a8a92;--card:#0f0f13;--line:#24242b;--glow:rgba(255,20,10,.45);--glass:rgba(10,10,14,.6)}
*,*::before,*::after{box-sizing:inherit;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{background:var(--bg);color:var(--fg);font-family:var(--b);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);transition:background .4s,color .4s;overflow-x:hidden}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ul{position:relative}.ul::after{content:"";position:absolute;left:0;bottom:-3px;height:2px;width:100%;background:var(--red);transform:scaleX(0);transform-origin:right;transition:transform .35s}
.ul:hover::after{transform:scaleX(1);transform-origin:left}
/* animated background */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg::before{content:"";position:absolute;inset:-100px;background:repeating-linear-gradient(115deg,transparent 0 60px,rgba(128,128,128,.09) 60px 61px);animation:lines 14s linear infinite}
@keyframes lines{to{transform:translate(-61px,0)}}
.bg i{position:absolute;border-radius:50%;background:var(--red);filter:blur(100px);opacity:.2;width:46vmax;height:46vmax}
[data-theme=light] .bg i{opacity:.12}
.bg i:nth-child(1){top:-15%;left:-10%;animation:o1 18s ease-in-out infinite alternate}
.bg i:nth-child(2){bottom:-20%;right:-15%;animation:o2 22s ease-in-out infinite alternate}
.bg i:nth-child(3){top:35%;left:40%;width:26vmax;height:26vmax;opacity:.12;animation:o3 16s ease-in-out infinite alternate}
@keyframes o1{to{transform:translate(30vw,25vh) scale(1.2)}}
@keyframes o2{to{transform:translate(-35vw,-20vh) scale(.85)}}
@keyframes o3{to{transform:translate(-25vw,15vh) scale(1.5)}}
.bg b{position:absolute;left:-50%;top:30%;width:50vw;height:2px;background:linear-gradient(90deg,transparent,var(--red),transparent);transform:rotate(-18deg);animation:sw 7s ease-in infinite;opacity:.8;box-shadow:0 0 18px var(--red)}
.bg b+b{top:70%;animation-delay:3.5s;animation-duration:9s}
@keyframes sw{0%{transform:translateX(0) rotate(-18deg)}100%{transform:translateX(260vw) rotate(-18deg)}}
#fx{position:fixed;inset:0;z-index:0;pointer-events:none}
main,footer{position:relative;z-index:1}
/* header */
header{position:fixed;z-index:30;top:calc(12px + env(safe-area-inset-top,0px));left:12px;right:12px;max-width:1100px;margin:auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:background .4s,border-color .4s}
.ib{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;position:relative;transition:transform .25s,background .25s}
.ib:hover{background:var(--glow)}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--d);font-size:26px;letter-spacing:.08em;transition:transform .3s,filter .3s}
.logo:hover{transform:scale(1.08);filter:drop-shadow(0 0 10px var(--red))}
.logo svg{width:30px;height:30px}
.badge{position:absolute;top:0;right:0;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;transform:scale(0);transition:transform .3s cubic-bezier(.3,1.8,.5,1)}
.badge.on{transform:scale(1)}.badge.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.7)}}
#cartBtn.bounce{animation:bnc .6s}
@keyframes bnc{30%{transform:translateY(-6px) rotate(-8deg)}60%{transform:translateY(0) rotate(6deg)}}
.sun{display:none}[data-theme=light] .sun{display:block}[data-theme=light] .moon{display:none}
/* drawers */
.ov{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .4s}
.ov.on{opacity:1;pointer-events:auto}
.dr{position:fixed;top:0;bottom:0;z-index:50;width:min(420px,88vw);background:var(--bg);border:1px solid var(--line);padding:calc(20px + env(safe-area-inset-top,0px)) 24px 24px;display:flex;flex-direction:column;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
#nav{left:0;transform:translateX(-105%)}#cart{right:0;transform:translateX(105%)}
.dr.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;font-family:var(--d);font-size:22px;letter-spacing:.1em}
.nl{font-family:var(--d);font-size:clamp(30px,8vw,40px);text-transform:uppercase;letter-spacing:.03em;display:block;padding:8px 0}
.lock-i{opacity:.45;cursor:not-allowed}.lock-i .t{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:3px}
.soon{display:inline-block;margin-left:10px;padding:3px 8px;background:var(--red);color:#fff;font:700 10px var(--b);letter-spacing:.15em;vertical-align:middle;animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 14px var(--red)}}
.sub{padding-left:18px;border-left:2px solid var(--line);margin:0 0 10px 4px}.sub .nl{font-size:22px;padding:4px 0}
/* hero */
.hero{height:100vh;height:100svh;position:relative;display:grid;place-items:center;text-align:center;overflow:hidden;
background:radial-gradient(ellipse at 50% 60%,var(--glow),transparent 60%)}
/* BACKGROUND SLOT: replace with <video autoplay muted loop playsinline> or background-image */

.hero>div{position:relative;z-index:2;padding:0 16px}
.hero .big{font-family:var(--d);font-size:clamp(90px,28vw,320px);line-height:.9;letter-spacing:.04em;text-shadow:0 0 60px var(--glow)}
.hero .big b{color:var(--red);font-weight:400}
.hero p{margin-top:18px;letter-spacing:.4em;font-size:12px;text-transform:uppercase;color:var(--fg);opacity:.85;text-shadow:0 1px 12px var(--bg),0 0 4px var(--bg)}
.hero svg.hl{width:clamp(170px,38vw,360px);height:clamp(170px,38vw,360px);filter:drop-shadow(0 0 40px var(--glow));animation:fl 4s ease-in-out infinite;transition:filter .4s}
.hero svg.hl:hover{filter:drop-shadow(0 0 70px var(--red))}
.hero svg.lg{width:72px;height:72px;margin-bottom:12px;animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
.btn{display:inline-block;padding:14px 28px;background:var(--red);color:#fff;font-weight:700;letter-spacing:.15em;text-transform:uppercase;font-size:13px;transition:transform .2s,box-shadow .3s;will-change:transform}
.btn:hover{box-shadow:0 0 28px var(--glow)}
.btn.o{background:none;border:2px solid var(--fg);color:var(--fg)}
/* hero photo */
:root{--ov:linear-gradient(180deg,rgba(246,245,242,.45),rgba(246,245,242,.8))}
:root[data-theme=dark]{--ov:linear-gradient(180deg,rgba(5,5,7,.3),rgba(5,5,7,.72))}
.hero>.phw{position:absolute;inset:0;z-index:0;padding:0;overflow:hidden;-webkit-mask-image:linear-gradient(#000 72%,transparent);mask-image:linear-gradient(#000 72%,transparent)}
.phw .ph{position:absolute;inset:0;background:url(hero.jpg) 50% 65%/cover no-repeat;filter:grayscale(.35) contrast(1.08);transform-origin:60% 70%;animation:kb 26s ease-in-out infinite alternate,phin 1.6s .1s backwards}
.phw .ov2{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,var(--glow),transparent 62%),var(--ov)}
@keyframes kb{from{transform:scale(1.04)}to{transform:scale(1.16) translate(-1.5%,-1%)}}
@keyframes phin{from{opacity:0}}
@keyframes pan{from{background-position:0% 50%}to{background-position:100% 50%}}
@media(max-aspect-ratio:1/1){.phw .ph{background-size:auto 100%;background-position:0% 50%;transform:none;animation:pan 20s ease-in-out infinite alternate,phin 1.6s .1s forwards}}
/* sections */
section{max-width:1100px;margin:auto;padding:80px 20px}
h2{font-family:var(--d);font-size:clamp(34px,7vw,64px);text-transform:uppercase;line-height:1;letter-spacing:.02em}
h2 em{color:var(--red);font-style:normal}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:36px 0;max-width:640px}
.cd div{border:2px solid var(--fg);padding:18px 4px;text-align:center;background:var(--card);transition:border-color .3s}
.cd div:hover{border-color:var(--red)}
.cd b{display:block;font-family:var(--d);font-size:clamp(34px,9vw,64px);line-height:1;font-weight:400;font-variant-numeric:tabular-nums}
.cd span{font-size:10px;letter-spacing:.25em;color:var(--mut);text-transform:uppercase}
.nf{display:flex;max-width:520px;border:2px solid var(--fg);transition:border-color .3s,box-shadow .3s}
.nf:focus-within{border-color:var(--red);box-shadow:0 0 22px var(--glow)}
.nf input{flex:1;min-width:0;padding:14px;background:none;border:0;outline:0;color:var(--fg);font:inherit}
.nf button{padding:0 18px;background:var(--fg);color:var(--bg);font-weight:700;letter-spacing:.12em;font-size:12px;text-transform:uppercase;transition:background .3s,color .3s}
.nf button:hover{background:var(--red);color:#fff}
.msg{margin-top:10px;font-size:13px;color:var(--mut);min-height:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin-top:36px}
.tc{position:relative;aspect-ratio:3/4;background:var(--card);border:1px solid var(--line);overflow:hidden;display:grid;place-items:center;transition:border-color .3s}
.tc svg.sil{width:70%;fill:var(--fg);opacity:.12;filter:blur(3px);transition:filter .6s,opacity .6s,transform .6s}
.tc .lbl{position:absolute;left:14px;bottom:14px;right:14px;display:flex;justify-content:space-between;font-size:11px;letter-spacing:.2em;text-transform:uppercase}
.tc .q{position:absolute;top:14px;left:14px;font-family:var(--d);font-size:20px;color:var(--red)}
.tc:hover{border-color:var(--red)}
.tc:hover svg.sil{filter:blur(0);opacity:.55;transform:scale(1.06);fill:var(--red)}
.p{background:var(--card);border:1px solid var(--line);transition:transform .35s,border-color .3s}
.p:hover{transform:translateY(-6px);border-color:var(--red)}
.p .im{aspect-ratio:1;display:grid;place-items:center;background:linear-gradient(135deg,var(--line),transparent)}
.p .im svg{width:60%;fill:var(--fg);opacity:.85}
.p .in{padding:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.p h3{font-size:14px;letter-spacing:.1em;text-transform:uppercase}.p small{color:var(--mut)}
.add{padding:10px 14px;background:var(--fg);color:var(--bg);font-size:11px;font-weight:700;letter-spacing:.12em;transition:background .25s,color .25s}
.add:hover{background:var(--red);color:#fff}
.lk{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:30px}
.lk div{aspect-ratio:4/5;background:repeating-linear-gradient(45deg,var(--card) 0 14px,var(--line) 14px 15px);display:grid;place-items:end start;padding:14px;font-family:var(--d);font-size:22px;transition:transform .4s}
.lk div:hover{transform:scale(.98)}
.ig{display:inline-grid;place-items:center;width:56px;height:56px;margin-top:24px;border:2px solid var(--fg);border-radius:16px;transition:background .3s,border-color .3s,box-shadow .3s,color .3s}
.ig svg{width:26px;height:26px}
.ig:hover{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 0 28px var(--glow)}
footer{border-top:1px solid var(--line);padding:40px 20px;text-align:center;color:var(--mut);font-size:12px;letter-spacing:.2em;text-transform:uppercase}
/* cart */
.items{flex:1;overflow:auto;display:flex;flex-direction:column;gap:14px}
.ci{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--line);animation:in .4s}
@keyframes in{from{opacity:0;transform:translateX(20px)}}
.ci .th{width:64px;height:64px;background:var(--card);display:grid;place-items:center}.ci .th svg{width:70%;fill:var(--fg)}
.q2{display:inline-flex;align-items:center;border:1px solid var(--line);margin-top:6px}.q2 button{width:28px;height:28px}.q2 button:hover{background:var(--red);color:#fff}.q2 span{width:26px;text-align:center;font-size:13px}
.empty{color:var(--mut);text-align:center;margin-top:60px}
.tot{display:flex;justify-content:space-between;font-family:var(--d);font-size:24px;padding:18px 0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:60;transform:translate(-50%,120px);background:var(--fg);color:var(--bg);padding:12px 20px;font-size:13px;letter-spacing:.1em;transition:transform .4s cubic-bezier(.2,1.4,.4,1)}
.toast.on{transform:translate(-50%,0)}
.rv{opacity:0;transform:translateY(30px);transition:opacity .8s,transform .8s}.rv.on{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="logo" viewBox="0 0 226 229"><path fill="#ed1c24" fill-rule="evenodd" d="M216.9 225.8C212.5 223.8 189.9 213.7 120.0 182.5C99.4 173.3 81.2 165.1 79.5 164.2C77.8 163.3 76.2 162.7 75.8 162.8C71.9 163.8 100.0 135.9 105.9 132.7C118.2 126.1 133.0 126.7 144.5 134.2C150.1 137.9 183.3 175.8 182.3 177.4C182.0 177.9 182.1 178.0 182.6 177.7C183.2 177.4 187.6 181.9 192.5 187.8C197.5 193.6 204.4 201.8 208.0 206.0C219.6 219.4 226.4 227.5 225.6 226.8C225.1 226.4 224.0 226.5 223.1 227.0C221.9 227.6 220.0 227.2 216.9 225.8ZM5.0 206.1C5.0 205.4 4.4 205.0 3.6 205.3C2.8 205.6 6.7 198.6 12.3 189.7C36.1 151.3 40.1 145.0 46.0 135.5C78.5 83.9 80.1 80.9 81.6 69.5C83.4 55.1 75.1 37.1 62.7 28.6C59.8 26.6 46.2 20.5 32.5 14.9C18.8 9.3 7.2 4.3 6.9 3.7C6.5 3.2 5.8 3.0 5.3 3.3C4.0 4.1 1.4 2.3 2.4 1.3C3.8 -0.2 210.3 0.3 210.6 1.8C210.7 2.5 210.6 2.6 210.3 2.0C209.5 0.3 207.7 0.9 208.4 2.7C209.0 4.2 181.6 32.4 165.9 46.5C164.0 48.2 161.1 51.1 159.4 53.0C150.0 63.3 63.3 149.0 62.7 148.5C62.3 148.2 62.2 148.3 62.5 148.7C63.3 149.7 20.8 192.0 19.7 191.3C19.1 191.0 19.0 191.1 19.3 191.7C19.6 192.2 16.5 196.0 12.5 200.0C8.4 204.1 5.0 206.9 5.0 206.1Z"/></symbol>
<symbol id="hoodie" viewBox="0 0 100 100"><path d="M35 12c4 8 26 8 30 0l20 12 10 44-16 4-4-24v42H25V48l-4 24-16-4 10-44z"/></symbol>
<symbol id="round" viewBox="0 0 100 100"><path d="M36 12c5 6 23 6 28 0l22 12 8 40-14 4-3-20v40H23V48l-3 20-14-4 8-40z"/></symbol>
</defs></svg>

<div class="bg"><i></i><i></i><i></i><b></b><b></b></div>
<canvas id="fx"></canvas>

<header>
  <span></span>
  <a href="#top" class="logo" aria-label="R7 home"><svg><use href="#logo"/></svg>R7</a>
  <div style="display:flex;justify-self:end">
    <button class="ib" id="themeBtn" aria-label="Toggle theme">
      <svg class="i sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>

<main id="top">
  <div class="hero">
    <div class="phw" aria-hidden="true"><div class="ph"></div><div class="ov2"></div></div>
    <div>
      <svg class="hl" role="img" aria-label="R7"><use href="#logo"/></svg>
      <p>Streetwear — Est. 2026</p>
      <p style="margin-top:36px"><a href="#drop" class="btn" data-mag>The Drop</a></p>
    </div>
  </div>

  <section id="drop" class="rv">
    <h2>Winter Collection —<br><em>Coming Soon</em></h2>
    <div class="cd" id="cd" aria-live="off">
      <div><b id="d">00</b><span>Days</span></div><div><b id="h">00</b><span>Hours</span></div>
      <div><b id="m">00</b><span>Mins</span></div><div><b id="s">00</b><span>Secs</span></div>
    </div>
    <form class="nf" id="nf"><input type="email" id="em" placeholder="Email for drop alerts only" required aria-label="Email"><button>Notify Me</button></form>
    <div class="msg" id="msg">No account. No spam. One email when we drop.</div>
  </section>



  <section id="contact" class="rv">
    <h2>Con<em>tact</em></h2>
    <p style="margin-top:20px;color:var(--mut)">Orders, collabs, press — <a class="ul" href="mailto:hello@r7.example">R7</a></p>
    <a class="ig" href="https://www.instagram.com/r7.elnegdy/" target="_blank" rel="noopener" aria-label="R7 on Instagram" data-mag><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6" fill="currentColor"/></svg></a>
  </section>
</main>
<footer>© 2026 R7 — All rights reserved</footer>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const store={get(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch(e){return f}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
/* theme */
$("#themeBtn").onclick=()=>{const t=document.documentElement.dataset.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=t;store.set("r7-theme",t)};
/* toast */
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),2200)}
/* countdown */
const target=new Date("2026-11-03T19:29:00Z").getTime();
function tick(){let x=Math.max(0,target-Date.now());const p=n=>String(n).padStart(2,"0");
  $("#d").textContent=p(Math.floor(x/864e5));$("#h").textContent=p(Math.floor(x/36e5)%24);$("#m").textContent=p(Math.floor(x/6e4)%60);$("#s").textContent=p(Math.floor(x/1e3)%60)}
tick();setInterval(tick,1000);
/* notify */
$("#nf").onsubmit=e=>{e.preventDefault();const v=$("#em").value.trim(),l=store.get("r7-notify",[]);
  if(!l.includes(v)){l.push(v);store.set("r7-notify",l)}
  $("#msg").textContent="You're on the list. We'll email you when Winter drops.";$("#em").value="";toast("YOU'RE IN")};
/* magnetic */
if(matchMedia("(hover:hover)").matches)$$("[data-mag],.ib,.logo").forEach(el=>{
  el.addEventListener("mousemove",e=>{const r=el.getBoundingClientRect();el.style.transform=`translate(${(e.clientX-r.left-r.width/2)*.25}px,${(e.clientY-r.top-r.height/2)*.35}px)`});
  el.addEventListener("mouseleave",()=>el.style.transform="")});
/* reveal */
const io=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting&&e.target.classList.add("on")),{threshold:.12});
$$(".rv").forEach(e=>io.observe(e));

/* ember particles */
(()=>{const c=$("#fx"),x=c.getContext("2d");let W,H,P=[];
const rs=()=>{W=c.width=innerWidth;H=c.height=innerHeight};rs();addEventListener("resize",rs);
const N=innerWidth<700?28:60;
const mk=(f)=>({x:Math.random()*W,y:f?Math.random()*H:H+10,r:Math.random()*2+.6,v:Math.random()*.6+.25,d:Math.random()*1.5,a:Math.random()*.6+.2,p:Math.random()*6.28});
for(let i=0;i<N;i++)P.push(mk(true));
if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
(function f(){x.clearRect(0,0,W,H);
 for(const p of P){p.y-=p.v;p.p+=.02;p.x+=Math.sin(p.p)*.4+p.d*.15;
  if(p.y<-10)Object.assign(p,mk(false));
  x.beginPath();x.arc(p.x,p.y,p.r,0,6.28);x.fillStyle="rgba(225,6,0,"+p.a*(p.y/H)+")";x.shadowColor="#e10600";x.shadowBlur=8;x.fill()}
 requestAnimationFrame(f)})()})();
</script>
